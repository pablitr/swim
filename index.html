<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SwimCoach Tracker</title>
  
  <!-- PWA & Meta Tags -->
  <meta name="description" content="Local-first Progressive Web App for swimming coaches to track multiple swimmers, paces, and zones simultaneously.">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SwimCoach">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header & Heat Controls -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 512 512" aria-hidden="true">
          <circle cx="256" cy="276" r="160" stroke="#38bdf8" stroke-width="24" fill="#131d33"/>
          <line x1="256" y1="276" x2="330" y2="202" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
          <circle cx="256" cy="276" r="16" fill="#38bdf8"/>
        </svg>
        <h1 class="brand-title">
          SwimCoach Tracker
          <span class="brand-badge">PWA</span>
        </h1>
      </div>

      <div class="header-status">
        <div id="connection-status" class="status-indicator" title="Network status">
          <span class="status-dot"></span>
          <span id="connection-text">Online</span>
        </div>
      </div>
    </div>

    <!-- Master Heat Controls -->
    <div class="master-controls" role="region" aria-label="Heat Master Controls">
      <button id="btn-master-start" class="btn-master btn-start-all" title="Start all active swimmers">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Start All
      </button>

      <button id="btn-master-stop" class="btn-master btn-stop-all" title="Stop all running timers">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="5" width="14" height="14" rx="2"/>
        </svg>
        Stop All
      </button>

      <button id="btn-master-reset" class="btn-master btn-reset-all" title="Reset all timers to zero">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset All
      </button>

      <button id="btn-add-swimmer-trigger" class="btn-master btn-add-swimmer" title="Add a new swimmer card">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Swimmer
      </button>
    </div>
  </header>

  <!-- Main Grid Area -->
  <main class="app-main">
    <div id="swimmer-grid" class="swimmer-grid" aria-live="polite">
      <!-- Swimmer cards dynamically rendered here by ui/swimmer-card.js -->
    </div>
  </main>

  <!-- Add/Edit Swimmer Modal -->
  <div id="swimmer-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Add Swimmer</h2>
        <button id="modal-close-btn" class="btn-icon" aria-label="Close modal">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="swimmer-form" class="modal-body">
        <input type="hidden" id="swimmer-id-input" name="id">
        
        <div class="form-group">
          <label for="swimmer-name-input" class="form-label">Swimmer Name</label>
          <input type="text" id="swimmer-name-input" name="name" class="form-input" placeholder="e.g. Alex Phelps" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="swimmer-lane-input" class="form-label">Lane Number</label>
          <input type="number" id="swimmer-lane-input" name="lane" class="form-input" min="1" max="10" placeholder="1-10">
        </div>

        <div class="form-group">
          <label for="swimmer-baseline-input" class="form-label">Baseline 100m Time (seconds)</label>
          <input type="number" id="swimmer-baseline-input" name="baseline100m" class="form-input" step="0.1" min="10" max="300" placeholder="e.g. 60.0">
          <span style="font-size: var(--font-xs); color: var(--text-muted); margin-top: 4px;">
            Used to calculate 75%, 80%, and 90% training zones.
          </span>
        </div>

        <div class="modal-footer">
          <button type="button" id="modal-cancel-btn" class="btn-secondary">Cancel</button>
          <button type="submit" id="modal-save-btn" class="btn-master btn-start-all">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Service Worker Registration Script -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('[PWA] Service Worker registered with scope:', reg.scope);
          })
          .catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }

    // Connection status listener
    function updateConnectionStatus() {
      const statusEl = document.getElementById('connection-status');
      const textEl = document.getElementById('connection-text');
      if (!statusEl || !textEl) return;
      if (navigator.onLine) {
        statusEl.classList.remove('offline');
        textEl.textContent = 'Online';
      } else {
        statusEl.classList.add('offline');
        textEl.textContent = 'Offline';
      }
    }
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    updateConnectionStatus();
  </script>

  <!-- ES Module Application Coordinator -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
